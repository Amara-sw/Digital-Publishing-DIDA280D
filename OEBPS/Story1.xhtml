<h1 class="Base Heading_1 p2"><span class="span1">The Red Wheelbarrow</span></h1>
<h2 class="Base Heading_2 p3"><span class="span2">William Carlos Williams</span></h2>
<p class="p4"></p>
<p class="Base Body p5"><span class="span3">so much depends</span></p>
<p class="Base Body p5"><span class="span3">upon</span></p>
<p class="Base Body p5"><span class="span3">a red wheel</span></p>
<p class="Base Body p5"><span class="span3">barrow</span></p>
<p class="Base Body p5"><span class="span3">glazed with rain</span></p>
<p class="Base Body p5"><span class="span3">water</span></p>
<p class="Base Body p5"><span class="span3">beside the white</span></p>
<p class="Base Body p5"><span class="span3">chickens</span></p>
